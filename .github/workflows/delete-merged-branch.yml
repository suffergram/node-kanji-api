name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete source branch after merge
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = [
              'develop', 'main', 'master',
              context.payload.repository.default_branch,
            ];
            if (protectedBranches.includes(branch)) {
              core.info(`Keeping permanent branch: ${branch}`);
              return;
            }

            const ref = `heads/${branch}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch already deleted: ${branch}`);
                return;
              }
              throw error;
            }

            await github.rest.git.deleteRef({ ...context.repo, ref });
            core.info(`Deleted branch: ${branch}`);
